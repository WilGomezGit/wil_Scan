<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="WG">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151833"/>
      <stop offset="1" stop-color="#07080f"/>
    </linearGradient>
    <linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="40" y1="150" x2="464" y2="366">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff00e5"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff00e5" stop-opacity=".55"/>
    </linearGradient>
    <clipPath id="cut"><rect x="0" y="160" width="512" height="196"/></clipPath>
  </defs>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#bg)"/>
  <rect x="15" y="15" width="482" height="482" rx="113" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <g transform="translate(256 256) scale(.9) translate(-250 -258)" fill="none" stroke="url(#ln)" stroke-width="40" stroke-linecap="butt">
    <!-- W: patas con la misma inclinación, recortadas a la altura exacta de la G -->
    <path d="M52 140 L112 376 L150.6 224 L189.2 376 L249.2 140" stroke-linejoin="bevel" clip-path="url(#cut)"/>
    <!-- G: esquinas cortadas a 45° -->
    <path d="M444 180 L336 180 L298 218 L298 298 L336 336 L444 336 L444 262 L382 262" stroke-linejoin="miter"/>
  </g>
</svg>
